name: Refresh FPL data
on:
  schedule:
    # Twice daily: mornings after overnight bonus finalization, and late evening after matches (UTC)
    - cron: "30 5 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch FPL data
        run: node scripts/fetch-fpl.mjs
      - name: Commit if changed
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
